import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.library'
    id 'org.jetbrains.dokka'
    id 'org.jetbrains.dokka-javadoc'
    id 'maven-publish'
}

def prop = { String name -> project.findProperty(name) as String }

android {
    namespace = 'com.vojtkovszky.billinghelper'

    defaultConfig {
        minSdk = prop('minSdkVersion') as Integer
        targetSdk = prop('targetSdkVersion') as Integer
        compileSdk = prop('compileSdkVersion') as Integer
        versionName = prop('versionName')
        buildToolsVersion = prop('buildToolsVersion')
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.toVersion(prop('javaVersion'))
        targetCompatibility = JavaVersion.toVersion(prop('javaVersion'))
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.fromTarget(prop('javaVersion'))
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            create("release", MavenPublication) {
                from components.getByName("release")
                groupId = prop('groupId')
                artifactId = prop('artifactId')
                version = prop('versionName')
                artifact tasks.named('dokkaJavadocJar')
            }
        }
    }
}

tasks.register('dokkaJavadocJar', Jar) {
    dependsOn 'dokkaGeneratePublicationJavadoc'   // v2 task
    archiveClassifier.set('javadoc')
    from(layout.buildDirectory.dir('dokka/javadoc'))
}

dokka {
    moduleName.set("BillingHelper")
}

dependencies {
    /* https://developer.android.com/jetpack/androidx/releases/core */
    implementation 'androidx.core:core-ktx:1.19.1'
    /*
    https://developer.android.com/google/play/billing/billing_library_overview
    https://developer.android.com/google/play/billing/release-notes
     */
    api 'com.android.billingclient:billing-ktx:9.1.0'

    /* https://developer.android.com/jetpack/androidx/releases/test */
    testImplementation 'junit:junit:4.13.2'
    /* real JSON parsing for building Purchase and ProductDetails in local unit tests: https://github.com/stleary/JSON-java */
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}